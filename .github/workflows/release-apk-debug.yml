name: Release APK (debug)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "A release precisa de uma tag v* (recebido: ${TAG})" >&2
              exit 1
              ;;
          esac
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Nenhum APK de debug foi gerado" >&2
            exit 1
          fi
          OUT="CapsulaDoFuturo-${TAG}-debug.apk"
          cp "$APK" "$OUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "file=${OUT}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.file }}
          fail_on_unmatched_files: true
